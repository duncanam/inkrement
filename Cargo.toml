[package]
name = "inkrement"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
itertools = "0.14.0"
lopdf = "0.40.0"
ratatui = "0.30.0"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
typst = "0.14.2"
typst-pdf = "0.14.2"
unidiff = "0.4.0"

[dev-dependencies]
rstest = "0.26.1"
